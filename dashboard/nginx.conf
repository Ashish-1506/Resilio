server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;

    location = /api/chat {
        set $ai_upstream http://ai-engine:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        set $gateway_upstream http://gateway:3000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
    }

    location /chaos/ {
        set $chaos_upstream http://chaos-engine:8080;
        proxy_pass $chaos_upstream;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /ws/ {
        set $ai_upstream http://ai-engine:8000;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /metrics/ {
        set $ai_upstream http://ai-engine:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
    }

    location /prometheus/ {
        set $prometheus_upstream http://prometheus:9090;
        proxy_pass $prometheus_upstream/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
